<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経過観察ツール</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f3; --surface: #ffffff; --surface2: #f0efe9;
    --text: #1a1a18; --text-muted: #888780;
    --teal: #1D9E75; --teal-light: #E1F5EE; --teal-border: #5DCAA5; --teal-text: #085041;
    --coral: #D85A30; --coral-light: #FAECE7; --coral-border: #F0997B; --coral-text: #712B13;
    --blue: #378ADD; --blue-light: #E6F1FB; --blue-text: #0C447C;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.18);
    --radius: 10px; --radius-pill: 20px;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 15px; font-weight: 700; }
  .sync-badge { font-size: 11px; padding: 4px 12px; border-radius: var(--radius-pill); border: 1px solid var(--border-strong); color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
  .sync-badge.ok { background: var(--teal-light); border-color: var(--teal-border); color: var(--teal-text); }
  .sync-badge.err { background: var(--coral-light); border-color: var(--coral-border); color: var(--coral-text); }
  .mode-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; gap: 8px; }
  .mode-btn { padding: 6px 16px; border-radius: var(--radius-pill); font-size: 12px; font-family: inherit; cursor: pointer; border: 1px solid var(--border-strong); background: var(--surface2); color: var(--text-muted); transition: all 0.15s; }
  .mode-btn.active { background: var(--teal-light); border-color: var(--teal-border); color: var(--teal-text); font-weight: 500; }
  .container { max-width: 700px; margin: 0 auto; padding: 20px 16px 60px; }
  .sec-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .patient-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .patient-btn { padding: 7px 14px; border-radius: var(--radius-pill); font-size: 13px; font-family: inherit; cursor: pointer; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); transition: all 0.15s; }
  .patient-btn:hover { background: var(--surface2); }
  .patient-btn.active { background: var(--teal-light); border-color: var(--teal-border); color: var(--teal-text); font-weight: 500; }
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .metric-card { background: var(--surface2); border-radius: var(--radius); padding: 12px 14px; }
  .metric-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .metric-val { font-size: 22px; font-weight: 700; color: var(--text); }
  .metric-change { font-size: 11px; margin-top: 2px; }
  .change-good { color: var(--teal-text); } .change-bad { color: var(--coral-text); } .change-same { color: var(--text-muted); }
  .visit-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .visit-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--teal); margin-top: 4px; flex-shrink: 0; }
  .visit-date { font-size: 11px; color: var(--text-muted); min-width: 65px; }
  .vtags { display: flex; flex-wrap: wrap; gap: 4px; }
  .vtag { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .vtag-pain { background: var(--coral-light); color: var(--coral-text); }
  .vtag-stiff { background: var(--blue-light); color: var(--blue-text); }
  .vtag-range { background: #EAF3DE; color: #27500A; }
  .vtag-sensei { background: var(--surface2); color: var(--text-muted); }
  .vtag-custom { background: #EEEDFE; color: #3C3489; }
  .pred-box { background: var(--teal-light); border: 1px solid var(--teal-border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
  .pred-title { font-size: 12px; color: var(--teal-text); font-weight: 500; margin-bottom: 4px; }
  .pred-text { font-size: 13px; color: var(--teal-text); }
  .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .slider-label { font-size: 12px; color: var(--text-muted); min-width: 90px; }
  .slider-val { font-size: 13px; font-weight: 700; min-width: 28px; text-align: right; }
  .unit-txt { font-size: 11px; color: var(--text-muted); }
  input[type="range"] { flex: 1; accent-color: var(--teal); }
  input[type="text"], input[type="number"], select, textarea {
    font-size: 13px; font-family: inherit; padding: 8px 12px;
    border-radius: var(--radius); border: 1px solid var(--border-strong);
    background: var(--bg); color: var(--text); outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus { border-color: var(--teal); }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--text-muted); }
  .add-btn { padding: 9px 18px; border-radius: var(--radius); font-size: 13px; font-family: inherit; font-weight: 500; cursor: pointer; border: 1px solid var(--teal); background: var(--teal-light); color: var(--teal-text); transition: all 0.15s; white-space: nowrap; }
  .add-btn:hover { background: var(--teal); color: #fff; }
  .small-btn { padding: 7px 14px; border-radius: var(--radius); font-size: 12px; font-family: inherit; cursor: pointer; border: 1px solid var(--border-strong); background: var(--surface2); color: var(--text); transition: all 0.15s; }
  .small-btn:hover { background: var(--surface); }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .patient-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--teal-light); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--teal-text); flex-shrink: 0; }
  .sensei-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 10px; border-radius: 10px; background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .photo-area { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .photo-slot { width: 80px; height: 80px; border-radius: var(--radius); border: 1px dashed var(--border-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; color: var(--text-muted); background: var(--surface2); gap: 4px; }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius); }
  .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: #fff; font-size: 13px; padding: 10px 20px; border-radius: var(--radius-pill); transition: transform 0.25s ease; z-index: 100; pointer-events: none; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .chart-wrap { position: relative; width: 100%; height: 200px; margin-bottom: 14px; }
</style>
</head>
<body>

<header>
  <h1>経過観察ツール</h1>
  <div class="sync-badge" id="sync-badge">
    <span id="sync-icon">⟳</span>
    <span id="sync-text">接続中...</span>
  </div>
</header>

<div class="mode-bar">
  <button class="mode-btn active" id="btn-doctor" onclick="setMode('doctor')">先生モード</button>
  <button class="mode-btn" id="btn-patient" onclick="setMode('patient')">患者さんに見せる</button>
</div>

<div class="container">

  <!-- 先生モード -->
  <div id="doctor-mode">
    <div class="sec-label">先生を登録</div>
    <div class="row">
      <input type="text" id="new-sensei" placeholder="先生名（例：山田先生）" style="flex:1;" />
      <button class="small-btn" onclick="addSensei()">＋ 追加</button>
    </div>
    <div id="sensei-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;"></div>

    <div class="sec-label">患者を選択</div>
    <div class="patient-list" id="patient-list"></div>
    <div class="row">
      <input type="text" id="new-patient-id" placeholder="患者ID（例：T.Y. / 患者001）" style="flex:1;" />
      <select id="new-patient-sensei" style="min-width:120px;"></select>
      <button class="add-btn" onclick="addPatient()">＋ 患者追加</button>
    </div>

    <div id="patient-detail" style="display:none;">
      <hr class="divider">
      <div class="patient-header">
        <div class="avatar" id="patient-avatar">--</div>
        <div>
          <div style="font-size:15px;font-weight:700;" id="patient-name-disp"></div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:4px;">
            <span style="font-size:12px;color:var(--text-muted);" id="patient-visit-count"></span>
            <span class="sensei-badge" id="patient-sensei-badge"></span>
          </div>
        </div>
      </div>

      <div class="sec-label">新しい来院記録を追加</div>
      <div class="card">
        <div class="row" style="margin-bottom:12px;">
          <span style="font-size:12px;color:var(--text-muted);min-width:90px;">担当先生</span>
          <select id="visit-sensei" style="flex:1;"></select>
        </div>
        <div class="slider-row">
          <span class="slider-label">痛みレベル</span>
          <input type="range" min="0" max="10" value="5" step="1" id="sl-pain" oninput="document.getElementById('val-pain').textContent=this.value" />
          <span class="slider-val" id="val-pain">5</span><span class="unit-txt">/10</span>
        </div>
        <div class="slider-row">
          <span class="slider-label">硬さレベル</span>
          <input type="range" min="0" max="10" value="5" step="1" id="sl-stiff" oninput="document.getElementById('val-stiff').textContent=this.value" />
          <span class="slider-val" id="val-stiff">5</span><span class="unit-txt">/10</span>
        </div>
        <div class="slider-row">
          <span class="slider-label">可動域</span>
          <input type="range" min="0" max="30" value="10" step="1" id="sl-range" oninput="document.getElementById('val-range').textContent=this.value" />
          <span class="slider-val" id="val-range">10</span><span class="unit-txt">cm</span>
        </div>
        <div id="custom-sliders"></div>
        <div class="row">
          <input type="text" id="custom-name" placeholder="独自項目名（例：歩行距離）" style="flex:2;min-width:100px;" />
          <input type="text" id="custom-unit" placeholder="単位（例：m）" style="width:65px;" />
          <input type="number" id="custom-max" placeholder="最大値" style="width:65px;" value="100" />
          <button class="small-btn" onclick="addCustomSlider()">＋ 項目追加</button>
        </div>

        <div style="margin-bottom:12px;">
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">写真（前・横・後ろ）</div>
          <div class="photo-area">
            <label class="photo-slot" id="ph-label-0" for="ph0">📷<span>前</span></label>
            <label class="photo-slot" id="ph-label-1" for="ph1">📷<span>横</span></label>
            <label class="photo-slot" id="ph-label-2" for="ph2">📷<span>後ろ</span></label>
            <input type="file" id="ph0" accept="image/*" style="display:none" onchange="handlePhoto(0,this)" />
            <input type="file" id="ph1" accept="image/*" style="display:none" onchange="handlePhoto(1,this)" />
            <input type="file" id="ph2" accept="image/*" style="display:none" onchange="handlePhoto(2,this)" />
          </div>
        </div>

        <textarea id="visit-memo" placeholder="施術メモ（例：梨状筋リリース後、可動域改善）" style="width:100%;resize:vertical;min-height:60px;margin-bottom:12px;"></textarea>
        <button class="add-btn" onclick="addVisit()">💾 来院記録を保存</button>
      </div>

      <div class="sec-label" style="margin-top:16px;">来院履歴・グラフ</div>
      <div id="visit-history"></div>
    </div>
  </div>

  <!-- 患者モード -->
  <div id="patient-mode" style="display:none;">
    <div class="sec-label">患者を選択</div>
    <div class="patient-list" id="patient-list-p"></div>
    <div id="patient-report"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBfi9eyu8RXy7kl1UAujkDnXkIhLzxScf0",
  authDomain: "kansatsu-tool.firebaseapp.com",
  projectId: "kansatsu-tool",
  storageBucket: "kansatsu-tool.firebasestorage.app",
  messagingSenderId: "357129370344",
  appId: "1:357129370344:web:03aa0cfca3495aa8cf675d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const senseiCol = collection(db, "senseis");
const patientCol = collection(db, "patients");

let senseis = [];
let patients = [];
let currentPatient = null;
let photoData = [null, null, null];
let customItems = [];
let customDefs = [];
let chartInst = null;
let currentMode = 'doctor';

function setSyncBadge(state, text) {
  const badge = document.getElementById('sync-badge');
  const icon = document.getElementById('sync-icon');
  const span = document.getElementById('sync-text');
  badge.className = 'sync-badge ' + (state === 'ok' ? 'ok' : state === 'err' ? 'err' : '');
  icon.textContent = state === 'ok' ? '✓' : state === 'err' ? '✕' : '⟳';
  span.textContent = text;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Firestore listeners
onSnapshot(senseiCol, snap => {
  senseis = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
  setSyncBadge('ok', 'クラウド同期済み');
  renderSenseiList();
  refreshSenseiSelects();
}, () => setSyncBadge('err', '接続エラー'));

onSnapshot(patientCol, snap => {
  patients = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
  setSyncBadge('ok', 'クラウド同期済み');
  renderPatientList();
  renderPatientListP();
  if (currentPatient) {
    const p = patients.find(x => x.id === currentPatient);
    if (p) renderHistory(p);
  }
}, () => setSyncBadge('err', '接続エラー'));

// Init default senseis
getDocs(senseiCol).then(snap => {
  if (snap.empty) {
    ['山田先生', '田中先生'].forEach(name => addDoc(senseiCol, { name }));
  }
});

function renderSenseiList() {
  const el = document.getElementById('sensei-list');
  el.innerHTML = senseis.map(s => `<span class="sensei-badge">👤 ${s.name}</span>`).join('');
}

function refreshSenseiSelects() {
  const opts = senseis.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
  ['new-patient-sensei', 'visit-sensei'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = opts;
  });
}

window.addSensei = async () => {
  const name = document.getElementById('new-sensei').value.trim();
  if (!name || senseis.find(s => s.name === name)) return;
  await addDoc(senseiCol, { name });
  document.getElementById('new-sensei').value = '';
  showToast('先生を追加しました');
};

function renderPatientList() {
  const g = document.getElementById('patient-list');
  g.innerHTML = '';
  patients.forEach(p => {
    const b = document.createElement('button');
    b.className = 'patient-btn' + (currentPatient === p.id ? ' active' : '');
    b.innerHTML = `${p.id} <span style="font-size:10px;color:var(--text-muted);">${p.sensei || ''}</span>`;
    b.onclick = () => selectPatient(p.id);
    g.appendChild(b);
  });
}

function renderPatientListP() {
  const g = document.getElementById('patient-list-p');
  if (!g) return;
  g.innerHTML = '';
  patients.forEach(p => {
    const b = document.createElement('button');
    b.className = 'patient-btn' + (currentPatient === p.id ? ' active' : '');
    b.textContent = p.id;
    b.onclick = () => selectPatientReport(p.id);
    g.appendChild(b);
  });
}

window.addPatient = async () => {
  const id = document.getElementById('new-patient-id').value.trim();
  const sensei = document.getElementById('new-patient-sensei').value;
  if (!id || patients.find(p => p.id === id)) return;
  await addDoc(patientCol, { id, sensei, visits: [] });
  document.getElementById('new-patient-id').value = '';
  showToast('患者を追加しました');
  selectPatient(id);
};

window.selectPatient = (id) => {
  currentPatient = id;
  renderPatientList();
  const p = patients.find(x => x.id === id);
  if (!p) return;
  document.getElementById('patient-detail').style.display = '';
  document.getElementById('patient-avatar').textContent = id.slice(0, 2).toUpperCase();
  document.getElementById('patient-name-disp').textContent = id;
  document.getElementById('patient-visit-count').textContent = `来院 ${(p.visits||[]).length}回`;
  document.getElementById('patient-sensei-badge').textContent = `👤 ${p.sensei}`;
  const vs = document.getElementById('visit-sensei');
  if (vs && p.sensei) vs.value = p.sensei;
  customItems = []; customDefs = [];
  document.getElementById('custom-sliders').innerHTML = '';
  photoData = [null, null, null];
  ['ph-label-0','ph-label-1','ph-label-2'].forEach((lid, i) => {
    document.getElementById(lid).innerHTML = `📷<span>${['前','横','後ろ'][i]}</span>`;
  });
  renderHistory(p);
};

window.addCustomSlider = () => {
  const name = document.getElementById('custom-name').value.trim();
  const unit = document.getElementById('custom-unit').value.trim() || '';
  const max = parseInt(document.getElementById('custom-max').value) || 100;
  if (!name || customItems.includes(name)) return;
  customItems.push(name);
  customDefs.push({ name, unit, max });
  document.getElementById('custom-name').value = '';
  document.getElementById('custom-unit').value = '';
  document.getElementById('custom-max').value = '100';
  const safeId = name.replace(/\s/g, '_');
  const div = document.createElement('div');
  div.className = 'slider-row';
  div.innerHTML = `<span class="slider-label">${name}</span>
    <input type="range" min="0" max="${max}" value="${Math.floor(max/2)}" step="1" id="sl-c-${safeId}" oninput="document.getElementById('val-c-${safeId}').textContent=this.value" />
    <span class="slider-val" id="val-c-${safeId}">${Math.floor(max/2)}</span><span class="unit-txt">${unit}</span>`;
  document.getElementById('custom-sliders').appendChild(div);
};

window.handlePhoto = (idx, input) => {
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    photoData[idx] = e.target.result;
    document.getElementById(`ph-label-${idx}`).innerHTML = `<img src="${e.target.result}" alt="写真${idx+1}" />`;
  };
  reader.readAsDataURL(input.files[0]);
};

window.addVisit = async () => {
  const p = patients.find(x => x.id === currentPatient);
  if (!p) return;
  const sensei = document.getElementById('visit-sensei').value;
  const custom = {};
  customDefs.forEach(def => {
    const el = document.getElementById(`sl-c-${def.name.replace(/\s/g,'_')}`);
    if (el) custom[def.name] = { value: parseInt(el.value), unit: def.unit, max: def.max };
  });
  const visits = [...(p.visits || []), {
    date: new Date().toISOString().slice(0, 10),
    sensei,
    pain: parseInt(document.getElementById('sl-pain').value),
    stiff: parseInt(document.getElementById('sl-stiff').value),
    range: parseInt(document.getElementById('sl-range').value),
    custom,
    memo: document.getElementById('visit-memo').value,
    photos: [...photoData]
  }];
  try {
    await updateDoc(doc(db, 'patients', p.docId), { visits });
    document.getElementById('visit-memo').value = '';
    photoData = [null, null, null];
    showToast('来院記録を保存しました');
  } catch(e) {
    showToast('保存に失敗しました');
  }
};

function chg(curr, old, higher) {
  if (old === undefined || old === null) return '';
  const d = curr - old;
  if (d === 0) return '<span class="change-same">変化なし</span>';
  const good = higher ? d > 0 : d < 0;
  return `<span class="${good ? 'change-good' : 'change-bad'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>`;
}

function predictRecovery(visits) {
  if (!visits || visits.length < 2) return null;
  const first = visits[0].pain, last = visits[visits.length-1].pain;
  const improved = first - last, sessions = visits.length - 1;
  if (improved <= 0) return '痛みの推移を確認中です。';
  const needed = Math.ceil(last / (improved / sessions));
  const d = new Date(); d.setDate(d.getDate() + needed * 14);
  return `このペースだとあと約 ${needed} 回（${d.getMonth()+1}月${d.getDate()}日ごろ）で痛みレベル0近くまで改善できそうです。`;
}

function renderHistory(p) {
  const area = document.getElementById('visit-history');
  const visits = p.visits || [];
  if (!visits.length) { area.innerHTML = '<div class="empty">まだ来院記録がありません</div>'; return; }
  const last = visits[visits.length-1];
  const prev = visits.length > 1 ? visits[visits.length-2] : null;

  let html = `<div class="metrics-grid">
    <div class="metric-card"><div class="metric-label">痛み</div><div class="metric-val">${last.pain}<span style="font-size:13px;color:var(--text-muted);">/10</span></div><div class="metric-change">${chg(last.pain,prev?.pain,false)}</div></div>
    <div class="metric-card"><div class="metric-label">硬さ</div><div class="metric-val">${last.stiff}<span style="font-size:13px;color:var(--text-muted);">/10</span></div><div class="metric-change">${chg(last.stiff,prev?.stiff,false)}</div></div>
    <div class="metric-card"><div class="metric-label">可動域</div><div class="metric-val">${last.range}<span style="font-size:13px;color:var(--text-muted);">cm</span></div><div class="metric-change">${chg(last.range,prev?.range,true)}</div></div>`;
  Object.entries(last.custom||{}).forEach(([k,v]) => {
    const pv = prev?.custom?.[k]?.value;
    const hi = k.includes('距離')||k.includes('歩行')||k.includes('可動');
    html += `<div class="metric-card"><div class="metric-label">${k}</div><div class="metric-val">${v.value}<span style="font-size:13px;color:var(--text-muted);">${v.unit}</span></div><div class="metric-change">${chg(v.value,pv,hi)}</div></div>`;
  });
  html += '</div>';

  const pred = predictRecovery(visits);
  if (pred) html += `<div class="pred-box"><div class="pred-title">💡 改善予測</div><div class="pred-text">${pred}</div></div>`;

  html += `<div class="chart-wrap"><canvas id="prog-chart"></canvas></div>`;
  html += '<div class="sec-label">来院履歴</div>';
  [...visits].reverse().forEach(v => {
    const tags = [
      `<span class="vtag vtag-pain">痛み ${v.pain}</span>`,
      `<span class="vtag vtag-stiff">硬さ ${v.stiff}</span>`,
      `<span class="vtag vtag-range">可動域 ${v.range}cm</span>`,
      `<span class="vtag vtag-sensei">👤 ${v.sensei}</span>`,
    ];
    Object.entries(v.custom||{}).forEach(([k,val]) => {
      tags.push(`<span class="vtag vtag-custom">${k} ${val.value}${val.unit}</span>`);
    });
    html += `<div class="visit-row"><div class="visit-dot"></div><div class="visit-date">${v.date}</div><div style="flex:1;"><div class="vtags">${tags.join('')}</div>${v.memo?`<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${v.memo}</div>`:''}</div></div>`;
  });

  area.innerHTML = html;
  if (chartInst) { chartInst.destroy(); chartInst = null; }
  const ctx = document.getElementById('prog-chart');
  if (ctx) {
    chartInst = new Chart(ctx, {
      type: 'line',
      data: {
        labels: visits.map(v => v.date.slice(5)),
        datasets: [
          { label: '痛み', data: visits.map(v => v.pain), borderColor: '#D85A30', backgroundColor: 'rgba(216,90,48,0.08)', tension: 0.3, fill: true, pointRadius: 4 },
          { label: '硬さ', data: visits.map(v => v.stiff), borderColor: '#378ADD', tension: 0.3, fill: false, pointRadius: 4, borderDash: [4,3] },
          { label: '可動域', data: visits.map(v => v.range), borderColor: '#1D9E75', tension: 0.3, fill: false, pointRadius: 4, yAxisID: 'y2' },
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min:0, max:10, ticks:{stepSize:2} }, y2: { position:'right', min:0, max:30, ticks:{stepSize:5}, grid:{display:false} }, x: { ticks:{autoSkip:false,maxRotation:0} } } }
    });
  }
}

window.selectPatientReport = (id) => {
  currentPatient = id;
  renderPatientListP();
  const p = patients.find(x => x.id === id);
  const rep = document.getElementById('patient-report');
  const visits = p?.visits || [];
  if (!p || !visits.length) { rep.innerHTML = ''; return; }
  const first = visits[0], last = visits[visits.length-1];
  const pred = predictRecovery(visits);
  let html = `<hr class="divider">
    <div style="font-size:18px;font-weight:700;margin-bottom:4px;">${id} さんの回復記録</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${first.date} 初診 → ${last.date} 現在（${visits.length}回来院）</div>
    <div style="margin-bottom:14px;"><span class="sensei-badge">👤 担当：${p.sensei}</span></div>
    <div class="metrics-grid">
      <div class="metric-card"><div class="metric-label">痛みの改善</div><div class="metric-val" style="color:var(--teal);">-${first.pain-last.pain}</div><div style="font-size:11px;color:var(--text-muted);">${first.pain} → ${last.pain}</div></div>
      <div class="metric-card"><div class="metric-label">硬さの改善</div><div class="metric-val" style="color:var(--teal);">-${first.stiff-last.stiff}</div><div style="font-size:11px;color:var(--text-muted);">${first.stiff} → ${last.stiff}</div></div>
      <div class="metric-card"><div class="metric-label">可動域の改善</div><div class="metric-val" style="color:var(--teal);">+${last.range-first.range}cm</div><div style="font-size:11px;color:var(--text-muted);">${first.range} → ${last.range}cm</div></div>
    </div>`;
  if (pred) html += `<div class="pred-box"><div class="pred-title">💡 改善予測</div><div class="pred-text">${pred}</div></div>`;
  html += `<div class="chart-wrap"><canvas id="report-chart"></canvas></div>`;
  rep.innerHTML = html;
  new Chart(document.getElementById('report-chart'), {
    type: 'line',
    data: { labels: visits.map(v=>v.date.slice(5)), datasets: [
      { label:'痛み', data:visits.map(v=>v.pain), borderColor:'#D85A30', tension:0.3, fill:false, pointRadius:5, pointBackgroundColor:'#D85A30' },
      { label:'硬さ', data:visits.map(v=>v.stiff), borderColor:'#378ADD', tension:0.3, fill:false, pointRadius:5, pointBackgroundColor:'#378ADD', borderDash:[4,3] },
    ]},
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{min:0,max:10,ticks:{stepSize:2}}, x:{ticks:{autoSkip:false,maxRotation:0}} } }
  });
};

window.setMode = (mode) => {
  currentMode = mode;
  document.getElementById('doctor-mode').style.display = mode==='doctor' ? '' : 'none';
  document.getElementById('patient-mode').style.display = mode==='patient' ? '' : 'none';
  document.getElementById('btn-doctor').className = 'mode-btn'+(mode==='doctor'?' active':'');
  document.getElementById('btn-patient').className = 'mode-btn'+(mode==='patient'?' active':'');
  if (mode==='patient') renderPatientListP();
};
</script>
</body>
</html>
